name: Strix Security Runner

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repository to scan (owner/name)'
        required: true
        default: 'yotamfried-ux/Video-editing-with-drone'
        type: string
      target_ref:
        description: 'Git ref/commit to scan'
        required: true
        default: 'main'
        type: string
      scan_mode:
        description: 'Strix scan depth'
        required: true
        default: 'quick'
        type: choice
        options: [quick, standard, deep]
permissions:
  contents: read
env:
  STRIX_TELEMETRY: '0'
concurrency:
  group: strix-${{ inputs.target_repo }}-${{ inputs.target_ref }}
  cancel-in-progress: false
jobs:
  security-scan:
    name: Strix security scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate target
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.target_repo }}" in yotamfried-ux/*) ;; *) echo "Refusing target outside yotamfried-ux/*" >&2; exit 64 ;; esac
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_ref }}
          path: target
          persist-credentials: false
      - name: Record target SHA
        id: target
        shell: bash
        run: |
          echo "sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Target: ${{ inputs.target_repo }}@$(git -C target rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Docker
        run: docker info
      - name: Install Strix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pipx
          pipx install strix-agent
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Strix installation
        run: strix --help >/dev/null
      - name: Run Strix with autonomous free-model failover
        id: strix
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set +e
          MODELS=(
            'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free'
            'openrouter/nvidia/nemotron-3-super-120b-a12b:free'
            'openrouter/cohere/north-mini-code:free'
            'openrouter/qwen/qwen3.8-27b:free'
          )
          final_code=1
          selected_model=''
          mkdir -p strix-attempt-logs
          for model in "${MODELS[@]}"; do
            export STRIX_LLM="$model"
            for attempt in 1 2; do
              log="strix-attempt-logs/$(echo "$model" | tr '/:' '__')-$attempt.log"
              echo "Trying $model attempt $attempt" | tee -a "$GITHUB_STEP_SUMMARY"
              strix -n --target ./target --scan-mode "${{ inputs.scan_mode }}" 2>&1 | tee "$log"
              code=${PIPESTATUS[0]}
              if [[ "$code" == 0 || "$code" == 2 ]]; then
                final_code=$code; selected_model=$model; break 2
              fi
              if grep -Eqi '429|rate.?limit|provider.?overloaded|503|connection failed|temporar' "$log"; then
                sleep $((attempt * 10)); continue
              fi
              final_code=$code; selected_model=$model; break 2
            done
          done
          echo "exit_code=$final_code" >> "$GITHUB_OUTPUT"
          echo "selected_model=$selected_model" >> "$GITHUB_OUTPUT"
          echo "Selected model: ${selected_model:-none}; exit=$final_code" >> "$GITHUB_STEP_SUMMARY"
          exit "$final_code"
      - name: Build machine-readable result
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          STRIX_EXIT_CODE: ${{ steps.strix.outputs.exit_code }}
          STRIX_SELECTED_MODEL: ${{ steps.strix.outputs.selected_model }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          code=os.environ.get('STRIX_EXIT_CODE','')
          payload={'target_repo':'${{ inputs.target_repo }}','target_ref':'${{ inputs.target_ref }}','target_sha':os.environ.get('TARGET_SHA',''),'scan_mode':'${{ inputs.scan_mode }}','model':os.environ.get('STRIX_SELECTED_MODEL',''),'strix_exit_code':code,'status':{'0':'clean','2':'findings'}.get(code,'error'),'run_id':'${{ github.run_id }}','run_attempt':'${{ github.run_attempt }}'}
          pathlib.Path('strix-result.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
      - name: Upload Strix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            strix-result.json
            strix_runs/
            strix-attempt-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce scan result
        if: always()
        shell: bash
        env:
          STRIX_EXIT_CODE: ${{ steps.strix.outputs.exit_code }}
        run: |
          case "$STRIX_EXIT_CODE" in
            0) exit 0 ;;
            2) echo 'Strix found security vulnerabilities.' >&2; exit 2 ;;
            *) echo "Strix execution failed after autonomous free-model failover (exit=${STRIX_EXIT_CODE:-missing})." >&2; exit 1 ;;
          esac
