name: Strix Security Runner

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repository to scan (owner/name)'
        required: true
        default: 'yotamfried-ux/Video-editing-with-drone'
        type: string
      target_ref:
        description: 'Git ref/commit to scan'
        required: true
        default: 'main'
        type: string
      scan_mode:
        description: 'Strix scan depth'
        required: true
        default: 'quick'
        type: choice
        options: [quick, standard, deep]
  push:
    branches: [qualification/freellmapi-strix]
    paths: ['.github/workflows/strix-security-runner.yml']
permissions:
  contents: read
env:
  STRIX_TELEMETRY: '0'
concurrency:
  group: strix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  security-scan:
    name: Strix Qwen qualification scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: yotamfried-ux/Video-editing-with-drone
          ref: main
          path: target
          persist-credentials: false
      - name: Record target SHA
        id: target
        shell: bash
        run: echo "sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify Docker
        run: docker info
      - name: Install Strix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pipx
          pipx install strix-agent
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Strix installation
        run: strix --help >/dev/null
      - name: Run Strix with qualified Groq Qwen
        id: strix
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STRIX_LLM: groq/qwen/qwen3.8-27b
        shell: bash
        run: |
          set +e
          mkdir -p strix-attempt-logs
          log=strix-attempt-logs/groq-qwen.log
          strix -n --target ./target --scan-mode quick 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          execution_failed=0
          if grep -Eqi 'agent run failed|RateLimitError|rate_limit_exceeded|Request Entity Too Large|Requested [0-9]+.*Limit [0-9]+|Waiting for the first model response' "$log"; then
            execution_failed=1
          fi
          if grep -Eq 'Cost \$0\.0000 · Tokens 0' "$log" && grep -Eq 'SESSION ENDED' "$log"; then
            execution_failed=1
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "execution_failed=$execution_failed" >> "$GITHUB_OUTPUT"
          printf 'groq\tgroq/qwen/qwen3.8-27b\t1\t%s\t%s\n' "$code" "$execution_failed" > strix-attempts.tsv
          if [[ "$execution_failed" == 1 ]]; then
            echo 'Strix reported a nominal success but the agent/model execution failed.' >&2
            exit 70
          fi
          exit "$code"
      - name: Build machine-readable result
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          STRIX_EXIT_CODE: ${{ steps.strix.outputs.exit_code }}
          STRIX_EXECUTION_FAILED: ${{ steps.strix.outputs.execution_failed }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          code=os.environ.get('STRIX_EXIT_CODE','')
          failed=os.environ.get('STRIX_EXECUTION_FAILED','') == '1'
          status='error' if failed else {'0':'clean','2':'findings'}.get(code,'error')
          payload={'target_repo':'yotamfried-ux/Video-editing-with-drone','target_ref':'main','target_sha':os.environ.get('TARGET_SHA',''),'scan_mode':'quick','provider':'groq','model':'groq/qwen/qwen3.8-27b','strix_exit_code':code,'execution_failed':failed,'status':status,'run_id':'${{ github.run_id }}','run_attempt':'${{ github.run_attempt }}'}
          pathlib.Path('strix-result.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
      - name: Upload Strix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-qwen-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            strix-result.json
            strix-attempts.tsv
            strix_runs/
            strix-attempt-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce execution result
        if: always()
        shell: bash
        env:
          STRIX_EXIT_CODE: ${{ steps.strix.outputs.exit_code }}
          STRIX_EXECUTION_FAILED: ${{ steps.strix.outputs.execution_failed }}
        run: |
          if [[ "$STRIX_EXECUTION_FAILED" == 1 ]]; then
            echo 'Strix agent/model execution failed; refusing false-positive success.' >&2
            exit 1
          fi
          case "$STRIX_EXIT_CODE" in
            0|2) exit 0 ;;
            *) echo "Strix execution failed (exit=${STRIX_EXIT_CODE:-missing})." >&2; exit 1 ;;
          esac
