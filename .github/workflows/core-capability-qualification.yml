name: Core capability qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-capability-qualification.yml"
      - "external-skills/rtk/**"
      - "external-skills/graphify/**"
      - "external-skills/claude-mem/**"
      - "external-skills/superpowers/**"
      - "external-skills/gstack/**"
      - "external-skills/ui-ux-pro-max/**"

permissions:
  contents: read

jobs:
  rtk-upstream:
    name: RTK upstream qualification
    runs-on: ubuntu-latest
    steps:
      - name: Clone official RTK upstream
        run: git clone --depth 1 --branch master https://github.com/rtk-ai/rtk.git upstream-rtk
      - name: Record upstream revision
        working-directory: upstream-rtk
        run: git rev-parse HEAD
      - name: Run upstream CI test command
        working-directory: upstream-rtk
        run: cargo test --all
      - name: Build release binary
        working-directory: upstream-rtk
        run: cargo build --release
      - name: Verify official install checks
        working-directory: upstream-rtk
        run: |
          ./target/release/rtk --version
          RTK_DB_PATH="$RUNNER_TEMP/rtk-history.db" ./target/release/rtk gain

  graphify-upstream:
    name: Graphify upstream qualification
    runs-on: ubuntu-latest
    steps:
      - name: Clone official Graphify upstream
        run: |
          git clone --branch v8 https://github.com/Graphify-Labs/graphify.git upstream-graphify
          cd upstream-graphify
          git cat-file -e '47042beb05d1f6dd2186c0c499ae2840ce604ead^{commit}'
      - name: Record upstream revision
        working-directory: upstream-graphify
        run: git rev-parse HEAD
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Run upstream CI parity suite
        working-directory: upstream-graphify
        run: |
          uv sync --all-extras --frozen
          uv run --frozen pytest tests/ -q --tb=short
          uv run --frozen python -m tools.skillgen --check
          uv run --frozen python -m tools.skillgen --audit-coverage
          uv run --frozen python -m tools.skillgen --schema-singleton
      - name: Verify CLI
        working-directory: upstream-graphify
        run: uv run --frozen graphify --version


  claude-mem-upstream:
    name: claude-mem upstream qualification
    runs-on: ubuntu-latest
    steps:
      - name: Clone official claude-mem upstream
        run: git clone --depth 1 https://github.com/thedotmack/claude-mem.git upstream-claude-mem
      - name: Record upstream revision
        working-directory: upstream-claude-mem
        run: git rev-parse HEAD
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        working-directory: upstream-claude-mem
        run: npm install --no-audit --no-fund
      - name: Run official typecheck
        working-directory: upstream-claude-mem
        run: npm run typecheck
      - name: Run official build
        working-directory: upstream-claude-mem
        run: npm run build
      - name: Run official CI-safe focused suites
        working-directory: upstream-claude-mem
        run: |
          mkdir -p "$RUNNER_TEMP/claude-mem-data/logs"
          export CLAUDE_MEM_DATA_DIR="$RUNNER_TEMP/claude-mem-data"
          ~/.bun/bin/bun run test:infra
          ~/.bun/bin/bun run test:search
          ~/.bun/bin/bun run test:context
          ~/.bun/bin/bun run test:server
          ~/.bun/bin/bun run lint:hook-io
          ~/.bun/bin/bun run lint:spawn-env

  superpowers-upstream:
    name: Superpowers upstream qualification
    runs-on: ubuntu-latest
    steps:
      - name: Clone official Superpowers upstream
        run: git clone --depth 1 https://github.com/obra/superpowers.git upstream-superpowers
      - name: Record upstream revision
        working-directory: upstream-superpowers
        run: git rev-parse HEAD
      - name: Run official brainstorm-server plugin suite
        working-directory: upstream-superpowers/tests/brainstorm-server
        run: |
          npm ci
          npm test
      - name: Run official structural plugin checks
        working-directory: upstream-superpowers
        run: |
          bash tests/codex-plugin-sync/test-sync-to-codex-plugin.sh
          bash tests/diagnosing-superpowers/test-skill-structure.sh

  gstack-upstream:
    name: gstack upstream qualification
    runs-on: ubuntu-latest
    steps:
      - name: Clone official gstack upstream
        run: git clone --depth 1 https://github.com/garrytan/gstack.git upstream-gstack
      - name: Record upstream revision
        working-directory: upstream-gstack
        run: git rev-parse HEAD
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        working-directory: upstream-gstack
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install upstream CI prerequisites
        working-directory: upstream-gstack
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb x11-utils poppler-utils fonts-noto-color-emoji
          git config --global user.email "free-tests-ci@gstack.test"
          git config --global user.name "Free Tests CI"
          git config --global init.defaultBranch main
          git config --global --add safe.directory '*'
      - name: Generate official host skill docs
        working-directory: upstream-gstack
        run: bun run gen:skill-docs --host all
      - name: Prepare official free-suite generated assets
        working-directory: upstream-gstack
        run: |
          bun run vendor:xterm
          bash browse/scripts/build-node-server.sh
          bun run build:gates
          bun run build:cso
      - name: Run official free test suite
        working-directory: upstream-gstack
        run: xvfb-run -a bun run test:free
        env:
          GSTACK_EXPECT_BINARIES: "1"
          GSTACK_FREE_RETRY_FLAKY: "1"

  ui-ux-pro-max-upstream:
    name: ui-ux-pro-max upstream qualification
    runs-on: ubuntu-latest
    steps:
      - name: Clone official ui-ux-pro-max upstream
        run: git clone --depth 1 https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git upstream-ui-ux
      - name: Record upstream revision
        working-directory: upstream-ui-ux
        run: git rev-parse HEAD
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pytest
        run: pip install pytest
      - name: Install CLI dependencies
        working-directory: upstream-ui-ux/cli
        run: npm ci
      - name: Run official aggregate offline data gate
        working-directory: upstream-ui-ux
        run: npm --prefix cli run verify:data
      - name: Run official skill regression tests
        working-directory: upstream-ui-ux
        run: python3 -m pytest .claude/skills -v
      - name: Run official CLI typecheck
        working-directory: upstream-ui-ux/cli
        run: npm run typecheck
      - name: Run official CLI build
        working-directory: upstream-ui-ux/cli
        run: npm run build
