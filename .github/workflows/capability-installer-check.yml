name: Capability Installer Check

on:
  pull_request:
    paths:
      - 'tools/eos_capabilities.py'
      - 'tools/test_eos_capabilities.py'
      - 'capability-registry/INSTALL-PROFILES.json'
      - 'docs/GETTING-STARTED.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'external-skills/**'
      - 'capability-registry/agent-tools.md'
      - 'capability-registry/token-context-efficiency.md'
      - '.github/workflows/capability-installer-check.yml'
  push:
    branches: [main]
    paths:
      - 'tools/eos_capabilities.py'
      - 'tools/test_eos_capabilities.py'
      - 'capability-registry/INSTALL-PROFILES.json'
      - 'docs/GETTING-STARTED.md'
      - '.github/workflows/capability-installer-check.yml'

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m py_compile tools/eos_capabilities.py tools/test_eos_capabilities.py
      - name: Installer contract
        run: python tools/test_eos_capabilities.py
      - name: Clean-host core dry run
        run: python tools/eos_capabilities.py setup --project . --profile core --dry-run
      - name: Clean-host mobile dry run
        run: python tools/eos_capabilities.py setup --project . --profile mobile --dry-run
      - name: Knowledge integrity
        run: python tools/check_knowledge_integrity.py
