name: Native Outbox PostgreSQL Isolated Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/native-outbox-postgres-isolated.yml'
      - 'tests/native-outbox-postgres/**'

permissions:
  contents: read

concurrency:
  group: native-postgres-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ephemeral-ledger:
    name: PostgreSQL concurrency, crash, restart and restore
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nativeci
          POSTGRES_USER: native_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U native_ci -d nativeci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: native_ci
      PGPASSWORD: ephemeral-ci-only
      PGDATABASE: nativeci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated PostgreSQL test dependencies
        run: |
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version
          pg_restore --version
      - name: Validate exclusive CAS, unique ACK, real client hard crash and reconciliation
        run: python tests/native-outbox-postgres/test_postgres_ledger.py prepare
      - name: Restart only ephemeral PostgreSQL service container
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER"
          docker restart "$PG_CONTAINER" >/dev/null
          ready=0
          for attempt in $(seq 1 40); do
            if pg_isready -h 127.0.0.1 -p 5432 -U native_ci -d nativeci >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
      - name: Prove committed rows and uniqueness survived real database restart
        run: python tests/native-outbox-postgres/test_postgres_ledger.py verify-restart
      - name: Create independent database from real pg_dump and verify sha256 ledger
        run: python tests/native-outbox-postgres/test_postgres_ledger.py backup-restore
