name: Engineering OS Reel Capabilities
on:
  push:
    paths:
      - "tools/eos_capabilities.py"
      - "tools/eos_reel_install.py"
      - "capability-registry/INSTALL-PROFILES.json"
      - "tests/test_eos_reel_install.py"
      - "tests/test_openverse_audio_search.py"
      - "tools/openverse_audio_search.py"
      - "tools/reactbits_component.py"
      - "tests/test_eos_project_tools.py"
      - ".github/workflows/eos-reel-capabilities.yml"
  pull_request:
    paths:
      - "tools/eos_capabilities.py"
      - "tools/eos_reel_install.py"
      - "capability-registry/INSTALL-PROFILES.json"
      - "tests/test_eos_reel_install.py"
      - "tests/test_openverse_audio_search.py"
      - "tools/openverse_audio_search.py"
      - "tools/reactbits_component.py"
      - "tests/test_eos_project_tools.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile both install managers
        run: python3 -m compileall -q tools/eos_capabilities.py tools/eos_reel_install.py tools/openverse_audio_search.py tools/reactbits_component.py
      - name: Verify safe and idempotent actual skill linking in isolated fixtures
        run: |
          python3 -m unittest discover -s tests -p test_eos_reel_install.py -v
          python3 -m unittest discover -s tests -p test_openverse_audio_search.py -v
          python3 -m unittest discover -s tests -p test_eos_project_tools.py -v
      - name: Validate central registry and dry-run install route
        run: |
          python3 tools/eos_capabilities.py catalog --json > /tmp/eos-catalog.json
          python3 -c 'import json; a=json.load(open("/tmp/eos-catalog.json")); assert "hallmark" in a and "lemo-opuscar" in a'
          python3 tools/eos_capabilities.py ensure --tool hallmark --dry-run
          python3 tools/eos_capabilities.py ensure --tool lemo-opuscar --dry-run
          python3 tools/eos_capabilities.py ensure --tool openverse-audio
          python3 tools/openverse_audio_search.py --help
          python3 tools/eos_capabilities.py ensure --tool react-bits
  upstream-path-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical GitHub sources and installed SKILL.md paths
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "tools"))
          from eos_reel_install import _sources, _agent_sources
          manifest = json.loads(Path("capability-registry/INSTALL-PROFILES.json").read_text())
          names = manifest["profiles"]["reels-all"]["tools"]
          with tempfile.TemporaryDirectory() as temp:
              for name in names:
                  entry = manifest["tools"][name]
                  if entry["installer"] not in {"git-skills", "git-agents"}:
                      continue
                  dest = Path(temp) / name
                  repo = "https://github.com/" + entry["repository"] + ".git"
                  subprocess.run(["git", "clone", "--depth", "1", "--", repo, str(dest)], check=True, capture_output=True)
                  sources = (_agent_sources(dest, entry) if entry["installer"] == "git-agents" else _sources(dest, entry))
                  print(name, len(sources), "valid skill directories")
          PY

  live-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install actual Claude Code CLI, no login or paid API calls
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Install auxiliary CLI prerequisites only if missing
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tmux
          fi
      - name: Real external code install and idempotence on isolated Linux homes
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          manifest = json.loads(Path("capability-registry/INSTALL-PROFILES.json").read_text())
          tools = [
              n for n in manifest["profiles"]["reels-all"]["tools"]
              if manifest["tools"][n]["installer"] in {"git-skills", "git-agents"}
          ]
          with tempfile.TemporaryDirectory(prefix="eos-live-skills-") as top:
              for name in tools:
                  home = Path(top) / name
                  home.mkdir(parents=True)
                  env = os.environ.copy()
                  env["HOME"] = str(home)
                  cmd = ["python3", "tools/eos_capabilities.py", "ensure", "--tool", name]
                  first = subprocess.run(cmd, env=env, text=True, capture_output=True)
                  print(name, "install:", first.returncode, first.stdout[-800:])
                  if first.returncode:
                      raise RuntimeError(f"{name}: {first.stderr[-1500:]}")
                  second = subprocess.run(cmd, env=env, text=True, capture_output=True)
                  print(name, "repeat:", second.returncode, second.stdout[-400:])
                  if second.returncode or "SKIP" not in second.stdout:
                      raise RuntimeError(f"{name}: not idempotent")
          print("PASS: all curated GitHub skills physically installed and detected inside isolated homes")
          PY

  claude-plugin-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Exercise real Claude marketplace plugin installs in isolated homes
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          manifest = json.loads(Path("capability-registry/INSTALL-PROFILES.json").read_text())
          plugins = [
              n for n in manifest["profiles"]["reels-all"]["tools"]
              if manifest["tools"][n]["installer"] == "claude-plugin"
          ]
          with tempfile.TemporaryDirectory(prefix="eos-plugin-smoke-") as top:
              for name in plugins:
                  home = Path(top) / name
                  home.mkdir(parents=True)
                  env = os.environ.copy()
                  env["HOME"] = str(home)
                  cmd = ["python3", "tools/eos_capabilities.py", "ensure", "--tool", name]
                  proc = subprocess.run(cmd, env=env, text=True, capture_output=True)
                  print(name, "exit=", proc.returncode, proc.stdout[-500:], proc.stderr[-500:])
                  if proc.returncode:
                      raise RuntimeError(f"Plugin {name} was NOT installed/qualified")
          print("PASS: all registered Claude plugins installed in isolated CI homes")
          PY

  project-dependency-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install real project-local npm dependencies
        run: |
          mkdir -p /tmp/eos-test-ui /tmp/eos-test-video
          (cd /tmp/eos-test-ui && npm init -y)
          (cd /tmp/eos-test-video && npm init -y)
          python3 tools/eos_capabilities.py ensure --tool ui-sdk-react --project /tmp/eos-test-ui
          python3 tools/eos_capabilities.py status --profile reels-react --project /tmp/eos-test-ui --json
          python3 tools/eos_capabilities.py ensure --tool remotion-project --project /tmp/eos-test-video
          python3 tools/eos_capabilities.py status --profile reels-react-video --project /tmp/eos-test-video --json
      - name: Register actual shadcn/ui MCP with Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          python3 tools/eos_capabilities.py ensure --tool shadcn-mcp --project /tmp/eos-test-ui
          claude mcp list
