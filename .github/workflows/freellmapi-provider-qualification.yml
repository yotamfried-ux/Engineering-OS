name: Free LLM Provider Qualification

on:
  push:
    branches: [qualification/freellmapi-strix]
    paths: ['.github/workflows/freellmapi-provider-qualification.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-groq-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify Groq Qwen 3.8 native tool call
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY:-}" || { echo 'GROQ_API_KEY is missing'; exit 2; }
          cat > /tmp/request.json <<'JSON'
          {"model":"qwen/qwen3.8-27b","messages":[{"role":"user","content":"Use inspect_file to inspect app.py before answering."}],"tools":[{"type":"function","function":{"name":"inspect_file","description":"Inspect a source file","parameters":{"type":"object","properties":{"path":{"type":"string"}},"required":["path"],"additionalProperties":false}}}],"tool_choice":"required","temperature":0,"max_completion_tokens":256,"reasoning_effort":"none"}
          JSON
          HTTP=$(curl -sS -D /tmp/headers -o /tmp/result.json -w '%{http_code}' \
            -H "Authorization: Bearer $GROQ_API_KEY" -H 'Content-Type: application/json' \
            --data @/tmp/request.json https://api.groq.com/openai/v1/chat/completions)
          echo "native-call HTTP=$HTTP"; cat /tmp/result.json
          [[ "$HTTP" =~ ^2 ]] || exit 1
          python - <<'PY'
          import json
          d=json.load(open('/tmp/result.json')); calls=d['choices'][0]['message'].get('tool_calls') or []
          assert calls, d
          assert calls[0]['function']['name']=='inspect_file', calls
          assert json.loads(calls[0]['function']['arguments']).get('path')=='app.py'
          print('native_tool_call=PASS')
          PY

      - name: Verify Groq Qwen tool-result round trip
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          first=json.load(open('/tmp/result.json')); msg=first['choices'][0]['message']; call=msg['tool_calls'][0]
          body={'model':'qwen/qwen3.8-27b','messages':[{'role':'user','content':'Use inspect_file to inspect app.py before answering.'},msg,{'role':'tool','tool_call_id':call['id'],'content':'app.py contains: def health(): return "ok"'}],'tools':[{'type':'function','function':{'name':'inspect_file','description':'Inspect a source file','parameters':{'type':'object','properties':{'path':{'type':'string'}},'required':['path'],'additionalProperties':False}}}],'temperature':0,'max_completion_tokens':256,'reasoning_effort':'none'}
          open('/tmp/roundtrip-request.json','w').write(json.dumps(body))
          PY
          HTTP=$(curl -sS -D /tmp/roundtrip-headers -o /tmp/roundtrip-result.json -w '%{http_code}' \
            -H "Authorization: Bearer $GROQ_API_KEY" -H 'Content-Type: application/json' \
            --data @/tmp/roundtrip-request.json https://api.groq.com/openai/v1/chat/completions)
          echo "roundtrip HTTP=$HTTP"; cat /tmp/roundtrip-result.json
          [[ "$HTTP" =~ ^2 ]] || exit 1
          python - <<'PY'
          import json
          d=json.load(open('/tmp/roundtrip-result.json')); m=d['choices'][0]['message']
          assert m.get('content') or m.get('tool_calls'), d
          print('tool_round_trip=PASS')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-qwen38-qualification-${{ github.run_id }}
          path: |
            /tmp/result.json
            /tmp/headers
            /tmp/roundtrip-result.json
            /tmp/roundtrip-headers
          if-no-files-found: warn
          retention-days: 7
